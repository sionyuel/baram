name: CI
on:
  push:
  pull_request:
  merge_group:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          check_together: 'yes'
          scandir: 'tools'
  swift-format:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - run: swift format lint --strict --recursive OSXCore OSX GureumTests Preferences OSXTestApp
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - run: xcodebuild -version
      - name: Build and test without release-signing credentials
        run: >-
          xcodebuild -project Gureum.xcodeproj -scheme OSX -sdk macosx
          -destination 'platform=macOS' test
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Verify isolated Lab defaults initialization
        run: tools/tests/test_chord_lab_defaults.sh
      #- uses: sersoft-gmbh/xcodebuild-action@v4
      #  with:
      #    workspace: Gureum.xcworkspace
      #    scheme: App
      #    sdk: iphonesimulator
      #    destination: platform=iOS Simulator,OS=11.3,name=iPhone X
      #    action: build test
      #    output-formatter: xcpretty --color
  baram-release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - run: xcodebuild -version
      - name: Build universal Baram Release without signing credentials
        run: >-
          xcodebuild -project Gureum.xcodeproj -scheme OSX -configuration Release
          -sdk macosx -destination 'generic/platform=macOS'
          -derivedDataPath build/baram-release-ci
          -onlyUsePackageVersionsFromResolvedFile
          GUREUM_VARIANT=BARAM VERSION=1.0.0-rc.0
          ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          REGISTER_APP_WITH_LAUNCH_SERVICES=NO
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify Baram Release bundle contract
        run: >-
          tools/tests/test_baram_release_contract.sh
          "$PWD/build/baram-release-ci/Build/Products/Release/Baram.app" 1.0.0-rc.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify the public Baram site
        run: |
          node site/baram/build.mjs
          node site/baram/verify.mjs
